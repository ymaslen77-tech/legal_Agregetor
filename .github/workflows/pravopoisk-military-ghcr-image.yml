name: Package military-law release as Docker image (no VPS deploy)
on:
  push:
    branches:
      - release/pravopoisk-military-121-20261031
    paths:
      - .github/workflows/pravopoisk-military-ghcr-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: military-121-ghcr-image
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out verified application revision (not a moving branch)
        uses: actions/checkout@v4
        with:
          ref: 58887bee9d1bc18ba2e0482105e03bc04ad214b6
          persist-credentials: false
      - name: Enable Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish pinned 121-generator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/ymaslen77-tech/pravopoisk-military:rc-58887bee
          build-args: |
            ENABLE_MILITARY_PUBLIC_DRAFTS=true
          labels: |
            org.opencontainers.image.source=https://github.com/ymaslen77-tech/legal_Agregetor
            org.opencontainers.image.revision=58887bee9d1bc18ba2e0482105e03bc04ad214b6
            org.opencontainers.image.description=Military-law catalog and 121 draft generators (not legally filing-ready)
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish isolated Prisma migration tool for staging database
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: builder
          platforms: linux/amd64
          push: true
          tags: ghcr.io/ymaslen77-tech/pravopoisk-military:rc-58887bee-migrator
          build-args: |
            ENABLE_MILITARY_PUBLIC_DRAFTS=true
          labels: |
            org.opencontainers.image.source=https://github.com/ymaslen77-tech/legal_Agregetor
            org.opencontainers.image.revision=58887bee9d1bc18ba2e0482105e03bc04ad214b6
            org.opencontainers.image.description=Staging-only Prisma migrate deploy utility; not a production web image
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Note how to deploy safely
        run: |
          echo "Published candidate: ghcr.io/ymaslen77-tech/pravopoisk-military:rc-58887bee"
          echo "This workflow never connects to Coolify or changes production."
