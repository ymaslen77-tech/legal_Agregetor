name: Public SEO index safety and fake-risk audit

on:
  push:
    branches:
      - infra/coolify-russian-vps
    paths:
      - "src/app/voennoe-pravo/page.tsx"
      - "src/lib/repositories.ts"
      - "src/lib/seo.ts"
      - "src/lib/question-indexability.ts"
      - "scripts/make-lawyers-real.ts"
      - "scripts/reassign-fake-lawyer-answers.ts"
      - "src/app/sitemap-**"
      - "tests/e2e/public-indexation-safe.spec.ts"
      - "scripts/audit-live-public-indexing.ts"
      - ".github/workflows/public-seo-index-safety.yml"
  pull_request:
    branches:
      - infra/coolify-russian-vps
    paths:
      - "src/app/voennoe-pravo/page.tsx"
      - "src/lib/repositories.ts"
      - "src/lib/seo.ts"
      - "src/lib/question-indexability.ts"
      - "scripts/make-lawyers-real.ts"
      - "scripts/reassign-fake-lawyer-answers.ts"
      - "src/lib/qna-publication-rules.test.ts"
      - "src/app/sitemap-**"
      - "tests/e2e/public-indexation-safe.spec.ts"
      - "scripts/audit-live-public-indexing.ts"
      - ".github/workflows/public-seo-index-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - name: Block fake Q&A and synthetic lawyer indexing
        run: npx tsx src/lib/qna-publication-rules.test.ts
      - name: Forbid reactivation of synthetic-lawyer bulk publishing
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq 'prisma\.lawyer\.(update|updateMany|upsert|create)\(' scripts/make-lawyers-real.ts; then
            echo "::error::Synthetic lawyer publication mutation was reintroduced"
            exit 1
          fi
          grep -q 'process.argv.includes("--apply")' scripts/make-lawyers-real.ts
          if grep -Eq 'prisma\\.answer\\.(update|updateMany|upsert|create)\\(' scripts/reassign-fake-lawyer-answers.ts; then
            echo "::error::Synthetic answer attribution mutation was reintroduced"
            exit 1
          fi
          echo "Synthetic lawyer and answer tools are read-only"
      - name: Audit canonical sitemap and noindex safeguards
        run: npm run test:seo-core
      - name: Type-check the public indexing changes
        run: npm run typecheck

  live-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Read only currently deployed HTML, canonical, robots and sitemap
        run: npx tsx scripts/audit-live-public-indexing.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-seo-indexing-readonly
          path: artifacts/public-seo-indexing/
          retention-days: 14
          if-no-files-found: warn

  browser-index-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      ENABLE_MILITARY_PUBLIC_DRAFTS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Assert indexable hub, sitemap, canonical and noindex for unsafe military pages
        run: npx playwright test tests/e2e/public-indexation-safe.spec.ts --workers=1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: public-seo-indexation-browser-failure
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
