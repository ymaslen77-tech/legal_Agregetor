name: Pravopoisk shared lawyer-review prebuilt image
on:
  push:
    branches:
      - release/shared-document-review-20261102
    paths:
      - .github/workflows/shared-document-review-image.yml
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout shared review source
        uses: actions/checkout@v4
        with:
          ref: d0e5c8bce46c0de64ce99438fb2a73522492d457
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build reusable document review release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/ymaslen77-tech/pravopoisk-military:rc-shared-review-d0e5c8bc
          build-args: |
            ENABLE_MILITARY_PUBLIC_DRAFTS=true
          labels: |
            org.opencontainers.image.source=https://github.com/ymaslen77-tech/legal_Agregetor
            org.opencontainers.image.revision=d0e5c8bce46c0de64ce99438fb2a73522492d457
          cache-from: type=gha
          cache-to: type=gha,mode=max
