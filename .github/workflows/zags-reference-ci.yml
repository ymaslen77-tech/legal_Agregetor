name: Legal reference routes CI

on:
  pull_request:
  push:
    branches:
      - main
      - agent/zags-reference-final-clean
      - agent/divorce-property-route-hardening
      - agent/child-guardianship-reference-route
      - agent/parents-child-after-divorce-reference-route

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: legal_aggregator_ci
          POSTGRES_USER: legal_user
          POSTGRES_PASSWORD: legal_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U legal_user -d legal_aggregator_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://legal_user:legal_password@localhost:5432/legal_aggregator_ci?schema=public
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      SITE_URL: http://localhost:3000
      LEAD_ATTACHMENT_STORAGE_ROOT: /tmp/private-lead-attachments
      LOCAL_HTTP_E2E: "true"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate disposable browser-test encryption and session keys
        run: |
          echo "DOCUMENT_STORAGE_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: npm run prisma:generate
      - name: Apply all migrations to clean PostgreSQL
        run: npm run prisma:deploy
      - name: Verify migration history
        run: npx prisma migrate status
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Verify all 50 labor questionnaires against the API form contract
        run: npm run test:labor
      - run: npm run build
      - name: Run AI Navigator quality check
        run: |
          npm run start -- -p 3000 > /tmp/reference-routes-next.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT

          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:3000/ > /dev/null; then
              npm run quality:ai-navigator
              exit $?
            fi
            sleep 1
          done

          cat /tmp/reference-routes-next.log
          exit 1
      - name: Install Chromium, Firefox and WebKit for route and responsive acceptance
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Cross-browser responsive layouts and lab navigation timing
        run: npx playwright test --config=playwright.responsive.config.ts --workers=2
      - name: Verify protected military UI in a separate Preview-like runtime
        env:
          MILITARY_PREVIEW: "1"
          MILITARY_PREVIEW_SCOPE: "military-feature-preview"
        run: |
          npm run start -- -p 3706 > /tmp/military-preview-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3706/internal/military-preview/ > /dev/null; then
              PLAYWRIGHT_BASE_URL=http://127.0.0.1:3706 npx playwright test tests/e2e/military-preview.spec.ts --workers=1
              exit $?
            fi
            sleep 1
          done
          cat /tmp/military-preview-next.log
          exit 1
      - name: Run all family and labor route acceptance
        env:
          E2E_SUBMIT_REVIEW: "true"
        run: npx playwright test --workers=2 --grep-invert "@military-preview"
      - name: Confirm withdrawn review PDF was deleted
        run: test -z "$(find "$LEAD_ATTACHMENT_STORAGE_ROOT" -type f -name '*.pdf' -print -quit 2>/dev/null)"
      - name: Generate and inspect guardianship PDFs
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          export GUARDIANSHIP_PDF_AUDIT_DIR="$RUNNER_TEMP/guardianship-pdf-audit"
          npm run audit:guardianship-pdf
          for pdf in "$GUARDIANSHIP_PDF_AUDIT_DIR"/*.pdf; do
            pages="$(pdfinfo "$pdf" | awk '/^Pages:/ { print $2 }')"
            test "${pages:-0}" -gt 0
            pdftotext "$pdf" "${pdf%.pdf}.txt"
            test -s "${pdf%.pdf}.txt"
            grep -q 'Подготовленные сведения' "${pdf%.pdf}.txt"
            grep -q 'Правовая сверка:' "${pdf%.pdf}.txt"
            grep -q 'Страница 1 из' "${pdf%.pdf}.txt"
            for page in $(seq 1 "$pages"); do
              pdftotext -f "$page" -l "$page" "$pdf" - | grep -q '[[:alnum:]]'
            done
            pdftoppm -png -r 120 "$pdf" "${pdf%.pdf}-page"
            test "$(find "$GUARDIANSHIP_PDF_AUDIT_DIR" -maxdepth 1 -name "$(basename "${pdf%.pdf}")-page-*.png" | wc -l)" -eq "$pages"
          done
      - name: Generate and inspect parents and child PDF
        run: npm run audit:parents-child-pdf
      - name: Generate and inspect all new family and labor PDF/DOCX files
        run: |
          npm run audit:family-labor-files
          for pdf in artifacts/family-labor-file-audit/*.pdf; do
            pages="$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')"
            test "${pages:-0}" -gt 0
            pdftotext "$pdf" - | grep -q 'НЕ ГОТОВ К ПОДАЧЕ'
          done
      - name: Inspect all military PDF/DOCX files and render visual review samples
        run: |
          npm run audit:military-files
          pdf_count="$(find artifacts/military-file-audit -maxdepth 1 -name '*.pdf' | wc -l)"
          docx_count="$(find artifacts/military-file-audit -maxdepth 1 -name '*.docx' | wc -l)"
          test "$pdf_count" -eq 17
          test "$docx_count" -eq 17
          for pdf in artifacts/military-file-audit/*.pdf; do
            pages="$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')"
            test "${pages:-0}" -gt 0
            pdftotext "$pdf" - | grep -q 'НЕ ГОТОВ К ПОДАЧЕ'
            for n in $(seq 1 "$pages"); do
              pdftotext -f "$n" -l "$n" "$pdf" - | grep -q '[[:alnum:]]'
            done
          done
          mkdir -p artifacts/military-visual-audit
          for pdf in artifacts/military-file-audit/service-contract-service-order-copy.pdf artifacts/military-file-audit/military-discharge-discharge-basis.pdf; do
            test -s "$pdf"
            pdftoppm -f 1 -l 1 -scale-to 1200 -png -singlefile "$pdf" "artifacts/military-visual-audit/$(basename "${pdf%.pdf}")"
          done
          test "$(find artifacts/military-visual-audit -maxdepth 1 -name '*.png' | wc -l)" -eq 2
      - name: Upload PDF and browser acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guardianship-acceptance
          path: |
            ${{ runner.temp }}/guardianship-pdf-audit
            playwright-report
            test-results
            artifacts/responsive-metrics.ndjson
            artifacts/responsive-browser-results.json
            artifacts/family-labor-file-audit
            artifacts/military-file-audit
            artifacts/military-visual-audit
