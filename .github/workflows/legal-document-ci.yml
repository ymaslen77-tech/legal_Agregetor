name: Legal document generation checks

on:
  pull_request:
    paths:
      - "src/app/api/legal-drafts/**"
      - "src/lib/legal-draft-*"
      - "src/components/documents/**"
      - "package.json"
      - ".github/workflows/legal-document-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  legal-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Audit 17 military preliminary documents PDF/DOCX
        run: npm run audit:military-files
      - name: Upload military binary export acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: military-document-binary-audit
          path: artifacts/military-file-audit/
          if-no-files-found: warn
