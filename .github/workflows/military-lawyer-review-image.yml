name: Military law review button prebuilt image (not VPS deploy)
on:
  push:
    branches:
      - release/pravopoisk-military-legal-review-20261031
    paths:
      - .github/workflows/military-lawyer-review-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout tested, immutable application revision
        uses: actions/checkout@v4
        with:
          ref: feec1363cd9b544233b60f17c9580bf10fe92879
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish draft-review image without touching VPS
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/ymaslen77-tech/pravopoisk-military:rc-legal-review-feec1363
          build-args: |
            ENABLE_MILITARY_PUBLIC_DRAFTS=true
          labels: |
            org.opencontainers.image.source=https://github.com/ymaslen77-tech/legal_Agregetor
            org.opencontainers.image.revision=feec1363cd9b544233b60f17c9580bf10fe92879
          cache-from: type=gha
          cache-to: type=gha,mode=max
