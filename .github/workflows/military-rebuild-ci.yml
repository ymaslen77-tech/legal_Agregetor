name: Military rebuild static checks
on:
  push:
    branches:
      - feature/military-rebuild-from-zero-20261027
      - fix/military-coolify-buildtime-20261030
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:military
      - run: npm run build
